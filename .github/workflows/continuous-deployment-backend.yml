name: Continuous Deployment BackEnd
on:
  workflow_run:
    workflows: ["Continuos Integration BackEnd"]
    types:
    - completed
  workflow_dispatch:

# Duas execucoes simultaneas empurrariam commits concorrentes no nsse-gitops.
# Sem cancelamento: um deploy ja publicado no ECR precisa chegar no gitops.
concurrency:
  group: cd-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 495624154773.dkr.ecr.us-east-1.amazonaws.com
  IMAGE_REPO_PREFIX: nsse/production
  GITOPS_REPO: pauloedhuardo/nsse-gitops
  GITOPS_KUSTOMIZE_DIR: production

jobs:

  detect-changes:
    name: detect-changes
    # workflow_run dispara mesmo quando o CI falha. So seguimos em sucesso e na main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Consultar a ultima execucao bem-sucedida deste workflow.
      actions: read
    outputs:
      tag: ${{ steps.refs.outputs.tag }}
      # Array JSON com uma entrada por servico alterado, consumido como matriz
      # pelo job de build e como lista de bumps pelo update-gitops.
      services: ${{ steps.matrix.outputs.services }}
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        # paths-filter compara com o commit anterior, entao precisa do historico.
        fetch-depth: 0

    - name: Resolve refs and tag
      id: refs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        HEAD_SHA=$(git rev-parse HEAD)

        # A base e o commit da ultima execucao bem-sucedida deste workflow na
        # main. Comparar com HEAD~1 enxergaria so o ultimo commit e perderia
        # tudo que veio antes num push de varios commits - foi o que aconteceu
        # no push dde0de2..a15642e, onde a alteracao do main passou batida.
        BASE_SHA=""
        PREV=$(curl -sf \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs?status=success&branch=main&per_page=30" \
          | jq -r --arg wf "$GITHUB_WORKFLOW" --arg self "$GITHUB_RUN_ID" \
              '[.workflow_runs[] | select(.name == $wf and (.id|tostring) != $self)]
               | .[0].head_sha // empty' || true)

        # Precisa existir no clone e ser ancestral de HEAD; um force push ou uma
        # execucao vinda de outra branch tornaria o diff sem sentido.
        if [ -n "$PREV" ] \
           && git cat-file -e "${PREV}^{commit}" 2>/dev/null \
           && git merge-base --is-ancestor "$PREV" "$HEAD_SHA"; then
          BASE_SHA="$PREV"
          echo "base: ultima execucao bem-sucedida (${BASE_SHA})"
        elif git rev-parse --verify -q HEAD~1 >/dev/null; then
          BASE_SHA=$(git rev-parse HEAD~1)
          echo "base: sem execucao anterior utilizavel, usando HEAD~1 (${BASE_SHA})"
        else
          # Primeiro commit do repositorio: compara com a arvore vazia, o que
          # marca tudo como alterado.
          BASE_SHA=$(git hash-object -t tree /dev/null)
          echo "base: arvore vazia (repositorio sem commit anterior)"
        fi

        echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
        echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
        echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

    # Os filtros espelham o fecho transitivo de ProjectReference de cada servico,
    # identicos aos do CI. As imagens sao construidas da raiz do repositorio.
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        base: ${{ steps.refs.outputs.base }}
        ref: ${{ steps.refs.outputs.head }}
        filters: |
          main:
            - 'src/services/NotSoSimpleEcommerce.Main/**'
            - 'src/domains/NotSoSimpleEcommerce.Main.Domain/**'
            - 'src/domains/NotSoSimpleEcommerce.Order.Domain/**'
            - 'src/domains/NotSoSimpleEcommerce.Shared/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Repositories/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.S3Handler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SesHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SqsHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Utils/**'
            - '.dockerignore'
          order:
            - 'src/services/NotSoSimpleEcommerce.Order/**'
            - 'src/domains/NotSoSimpleEcommerce.Main.Domain/**'
            - 'src/domains/NotSoSimpleEcommerce.Order.Domain/**'
            - 'src/domains/NotSoSimpleEcommerce.Shared/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Repositories/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.S3Handler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SesHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SqsHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Utils/**'
            - '.dockerignore'
          identity-server:
            - 'src/services/NotSoSimpleEcommerce.IdentityServer/**'
            - 'src/domains/NotSoSimpleEcommerce.IdentityServer.Domain/**'
            - 'src/domains/NotSoSimpleEcommerce.Shared/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Repositories/**'
            - '.dockerignore'
          health-checker:
            - 'src/services/NotSoSimpleEcommerce.HealthChecker/**'
            - '.dockerignore'
          invoice-generator:
            - 'src/workers/NotSoSimpleEcommerce.InvoiceGenerator/**'
            - 'src/domains/NotSoSimpleEcommerce.Shared/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SesHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SqsHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Utils/**'
            - '.dockerignore'
          notificator:
            - 'src/workers/NotSoSimpleEcommerce.Notificator/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SesHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.SqsHandler/**'
            - 'src/infrastructure/NotSoSimpleEcommerce.Utils/**'
            - '.dockerignore'

    # Fonte unica da lista de servicos: o slug alimenta o nome do repositorio no
    # ECR, o scope do cache e o argumento do kustomize edit, entao nao ha como
    # divergirem entre si.
    - name: Build matrix
      id: matrix
      env:
        CHANGED: ${{ steps.filter.outputs.changes }}
        DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
      run: |
        set -euo pipefail

        # service -> Dockerfile. workflow_dispatch reconstroi todos.
        CATALOG=$(cat <<'JSON'
        [
          {"service":"main",              "dockerfile":"./src/services/NotSoSimpleEcommerce.Main/Dockerfile"},
          {"service":"order",             "dockerfile":"./src/services/NotSoSimpleEcommerce.Order/Dockerfile"},
          {"service":"identity-server",   "dockerfile":"./src/services/NotSoSimpleEcommerce.IdentityServer/Dockerfile"},
          {"service":"health-checker",    "dockerfile":"./src/services/NotSoSimpleEcommerce.HealthChecker/Dockerfile"},
          {"service":"invoice-generator", "dockerfile":"./src/workers/NotSoSimpleEcommerce.InvoiceGenerator/Dockerfile"},
          {"service":"notificator",       "dockerfile":"./src/workers/NotSoSimpleEcommerce.Notificator/Dockerfile"}
        ]
        JSON
        )

        if [ "$DISPATCH" = "true" ]; then
          SERVICES=$(jq -c '.' <<<"$CATALOG")
        else
          # steps.filter.outputs.changes e um array JSON com os filtros que casaram.
          SERVICES=$(jq -c --argjson changed "$CHANGED" \
            '[ .[] | select(.service as $s | $changed | index($s)) ]' <<<"$CATALOG")
        fi

        echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
        echo "Servicos a publicar: $(jq -r '[.[].service] | join(", ") // "nenhum"' <<<"$SERVICES")"

  build-and-push:
    name: build ${{ matrix.service }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    strategy:
      # Um servico que falha nao deve cancelar os demais que ja estao publicando.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:

    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        aws-region: ${{ env.AWS_REGION }}
        role-to-assume: ${{ vars.AWS_BACKEND_ROLE_TO_ASSUME }}

    - uses: aws-actions/amazon-ecr-login@v2

    - uses: docker/setup-buildx-action@v3

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_REPO_PREFIX }}/${{ matrix.service }}:${{ needs.detect-changes.outputs.tag }}
        # Mesmo scope do CI, entao o build aqui reaproveita o cache de la.
        cache-from: type=gha,scope=${{ matrix.service }}
        cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops:
    name: update-gitops
    needs: [detect-changes, build-and-push]
    # always() porque build-and-push fica skipped quando nada mudou. Exigimos
    # que nenhum servico tenha falhado, para nao mover a tag pela metade.
    if: >
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.services != '[]' &&
      needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:

    - name: Checkout gitops
      uses: actions/checkout@v4
      with:
        repository: ${{ env.GITOPS_REPO }}
        token: ${{ secrets.GITOPS_TOKEN }}
        ref: main

    - uses: imranismail/setup-kustomize@v2

    - name: Bump image tags for changed services
      working-directory: ${{ env.GITOPS_KUSTOMIZE_DIR }}
      env:
        TAG: ${{ needs.detect-changes.outputs.tag }}
        SERVICES: ${{ needs.detect-changes.outputs.services }}
      run: |
        set -euo pipefail
        # "*" preserva o newName existente e troca apenas a newTag.
        for svc in $(jq -r '.[].service' <<<"$SERVICES"); do
          echo "bump ${svc} -> ${TAG}"
          kustomize edit set image "${ECR_REGISTRY}/${IMAGE_REPO_PREFIX}/${svc}=*:${TAG}"
        done

    - name: Commit & push
      env:
        TAG: ${{ needs.detect-changes.outputs.tag }}
        SERVICES: ${{ needs.detect-changes.outputs.services }}
      run: |
        set -euo pipefail
        git config user.email "ci-bot@nsse.dev"
        git config user.name "nsse-ci-bot"
        git add "${GITOPS_KUSTOMIZE_DIR}/kustomization.yml"

        if git diff --staged --quiet; then
          echo "Nenhuma alteracao no kustomization.yml; nada a commitar."
          exit 0
        fi

        LIST=$(jq -r '[.[].service] | join(", ")' <<<"$SERVICES")
        git commit -m "ci(cd): bump ${LIST} to ${TAG}"

        # Outro deploy pode ter empurrado nesse intervalo.
        for attempt in 1 2 3; do
          if git push; then
            echo "push ok na tentativa ${attempt}"
            exit 0
          fi
          echo "push rejeitado; rebase e nova tentativa"
          git pull --rebase
        done

        echo "Falha ao empurrar no ${GITOPS_REPO} apos 3 tentativas" >&2
        exit 1
